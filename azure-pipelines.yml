trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '24.x'

steps:

# Install Node.js
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: $(NODE_VERSION)

# Install dependencies
- script: |
    npm ci
  displayName: 'Install Dependencies'

# Install Playwright browsers
- script: |
    npx playwright install --with-deps
  displayName: 'Install Playwright Browsers'

# Run tests
- script: |
    npm run test:web
  displayName: 'Execute Web Automation Tests'
  continueOnError: true

# Generate Allure HTML Report
- script: |
    npm install -g allure-commandline
    allure generate allure-results --clean -o allure-report
  displayName: 'Generate Allure Report'
  condition: always()

# Publish Cucumber HTML Report
- task: PublishPipelineArtifact@1
  displayName: 'Publish Cucumber Report'
  condition: always()
  inputs:
    targetPath: 'reports'
    artifact: 'CucumberReport'

# Publish Allure HTML Report
- task: PublishPipelineArtifact@1
  displayName: 'Publish Allure Report'
  condition: always()
  inputs:
    targetPath: 'allure-report'
    artifact: 'AllureReport'

# Publish Raw Allure Results
- task: PublishPipelineArtifact@1
  displayName: 'Publish Allure Results'
  condition: always()
  inputs:
    targetPath: 'allure-results'
    artifact: 'AllureResults'

# Publish Screenshots/Videos if available
- task: PublishPipelineArtifact@1
  displayName: 'Publish Test Evidence'
  condition: always()
  continueOnError: true
  inputs:
    targetPath: 'test-results'
    artifact: 'TestEvidence'