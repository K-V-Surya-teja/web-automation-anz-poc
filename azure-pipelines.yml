trigger:
  - main
  - web-workflow-test

variables:
- group: WebAutomationVariables

pool:
  vmImage: 'windows-latest'

steps:

- task: UseNode@1
  inputs:
    version: '24.x'
  displayName: 'Set Up Node.js'

- script: npm ci
  displayName: 'Install Dependencies'

- task: PowerShell@2
  displayName: 'Generate Email Report'
  inputs:
    targetType: 'inline'
    script: |
      npx ts-node reporting/generateEmailReport.ts

- task: PowerShell@2
  displayName: 'Verify Report Files'
  inputs:
    targetType: 'inline'
    script: |

      Write-Host "===== REPORT FILES ====="

      dir reports

      Write-Host "========================"

- task: PowerShell@2
  displayName: 'Send Email Report'
  condition: always()
  inputs:
    targetType: 'inline'
    script: |

      $html = Get-Content "reports/email-report.html" -Raw

      Write-Host "Original HTML Length: $($html.Length)"

      $maxLength = 6038

      if ($html.Length -gt $maxLength) {
        $html = $html.Substring(0, $maxLength)
      }

      $summary = Get-Content "reports/email-summary.json" -Raw | ConvertFrom-Json

      $subject = "ANZ Automation Report | Passed: $($summary.passedTests) | Failed: $($summary.failedTests) | Pass Rate: $($summary.passPercentage)%"

      $payload = @{
          subject = $subject
          htmlBody = $html
      } | ConvertTo-Json -Compress

      Invoke-RestMethod `
        -Uri "$(POWER_AUTOMATE_URL)" `
        -Method POST `
        -ContentType "application/json" `
        -Body $payload `
        -ErrorAction Stop

      Write-Host "Email sent successfully"