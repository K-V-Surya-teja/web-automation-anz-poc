name: Web Automation (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web-tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci
        shell: pwsh

      - name: Create reports dir
        run: New-Item -ItemType Directory -Path reports -Force
        shell: pwsh

      - name: Run Cucumber (capture output + JSON report) - PowerShell
        shell: pwsh
        run: |
          # Run cucumber-js, save JSON report and write full console output to cucumber.log
          # Use & to invoke npx so $LASTEXITCODE is set correctly.
          & npx cucumber-js --profile web --tags @registration --format json:reports/cucumber.json 2>&1 | Tee-Object -FilePath cucumber.log

          # Preserve the underlying process exit code
          $exitCode = ${LASTEXITCODE}
          exit $exitCode

      - name: Upload cucumber log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-log-windows
          path: cucumber.log

      - name: Upload cucumber JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-json-windows
          path: reports/cucumber.json