name: Web Automation (Windows)

on:
  push:
    branches: [ main, web-workflow-test ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web-tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci
        shell: pwsh

      - name: Create reports dir
        run: New-Item -ItemType Directory -Path reports -Force
        shell: pwsh

      - name: Load environment variables from .env
        shell: pwsh
        run: |
          $envContent = Get-Content .env -Raw
          $envContent -split '\n' | ForEach-Object {
            if ($_ -match '^\s*([^=]+)=(.*)$') {
              $key = $matches[1].Trim()
              $value = $matches[2].Trim()
              [Environment]::SetEnvironmentVariable($key, $value, [EnvironmentVariableTarget]::Process)
            }
          }

      - name: Run Cucumber with verbose logging - PowerShell
        shell: pwsh
        env:
          DEBUG: '*'
        run: |
          Write-Host "Environment Variables:"
          Write-Host "BROWSER=$([Environment]::GetEnvironmentVariable('BROWSER', 'Process'))"
          Write-Host "WEB_BASE_URL=$([Environment]::GetEnvironmentVariable('WEB_BASE_URL', 'Process'))"
          Write-Host ""
          
          # Run cucumber-js with verbose logging
          & npx cucumber-js --profile web --tags '@registration' --format json:reports/cucumber.json --format progress 2>&1 | Tee-Object -FilePath cucumber.log
          
          # Preserve the underlying process exit code
          $exitCode = ${LASTEXITCODE}
          Write-Host "Cucumber exit code: $exitCode"
          exit $exitCode

      - name: Upload cucumber log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-log-windows
          path: cucumber.log

      - name: Upload cucumber JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-json-windows
          path: reports/cucumber.json